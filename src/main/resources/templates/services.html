        <style>
    /* Basic styling for checkboxes */
    .dynamicCheckbox {
        width: 20px; /* Make checkboxes slightly bigger */
        height: 20px;
        cursor: pointer; /* Show pointer cursor on hover */
        accent-color: #007bff; /* Change checkbox color (modern browsers) */
    }

    /* Style checked checkboxes */
    .dynamicCheckbox:checked {
        background-color: #007bff; /* Blue background */
        border: 2px solid #0056b3;
    }

    /* Style when hovering over checkbox */
    .dynamicCheckbox:hover {
        transform: scale(1.1); /* Slightly enlarge checkbox on hover */
    }

    /* Label styling */
    label {
        font-size: 18px;
        margin-left: 8px;
        cursor: pointer;
        color: #333;
    }

    /* Checkbox container */
    ul {
        list-style: none;
        padding: 0;
    }

    ul li {
        margin: 10px 0;
        display: flex;
        align-items: center;
    }
</style>

});

function getHomeCategoryBasedOnId(homeId) {

                   );
                   `

       categoryContainer.empty(); //Ensure the div is cleared before appending text

   }
}
